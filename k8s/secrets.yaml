# This is a template, not a deployable production secret. Replace every
# REPLACE_WITH value through your CI/CD secret manager before applying it.
apiVersion: v1
kind: Secret
metadata:
  name: college-it-secrets
  namespace: college-it
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_A_STRONG_DATABASE_PASSWORD
  DATABASE_URL: postgresql+psycopg://college_it:REPLACE_WITH_A_STRONG_DATABASE_PASSWORD@postgres:5432/college_it
  JWT_SECRET_KEY: REPLACE_WITH_A_UNIQUE_JWT_SECRET_AT_LEAST_32_CHARACTERS_LONG
