apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: college-it
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: college-it
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: college-it
    spec:
      containers:
        - name: frontend
          image: registry.example.com/college-it/frontend:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-runtime
              mountPath: /tmp
      volumes:
        - name: nginx-runtime
          emptyDir: {}
