apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: college-it
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: college-it
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: college-it
    spec:
      initContainers:
        - name: migrate
          image: registry.example.com/college-it/backend:REPLACE_WITH_IMAGE_TAG
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: college-it-config
            - secretRef:
                name: college-it-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: registry.example.com/college-it/backend:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: college-it-config
            - secretRef:
                name: college-it-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
